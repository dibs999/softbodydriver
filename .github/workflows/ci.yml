name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            artifact: softbodydriver-linux-x64
          - name: windows-x64
            os: windows-latest
            artifact: softbodydriver-windows-x64
          - name: macos-universal
            os: macos-latest
            artifact: softbodydriver-macos-universal

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test + generate 3D replay HTML
        shell: bash
        run: |
          BIN=./build/apps/sbsim/sbsim
          if [ -f ./build/apps/sbsim/Release/sbsim.exe ]; then
            BIN=./build/apps/sbsim/Release/sbsim.exe
          fi
          mkdir -p dist/replays
          cp "$BIN" dist/
          cp -r content dist/
          "$BIN" --scene wall_crash --duration 1.8 --fps 25 --quiet --record dist/replays/wall_crash.json
          "$BIN" --scene ramp_jump  --duration 3.0 --fps 25 --quiet --record dist/replays/ramp_jump.json
          "$BIN" --scene bridge_overload --duration 6.5 --fps 20 --quiet --record dist/replays/bridge_overload.json
          "$BIN" --scene cube_drop  --duration 2.2 --fps 25 --quiet --record dist/replays/cube_drop.json
          python3 tools/make_viewer.py -o dist/replay_viewer.html \
            dist/replays/wall_crash.json dist/replays/ramp_jump.json \
            dist/replays/bridge_overload.json dist/replays/cube_drop.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
