name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            artifact: softbodydriver-linux-x64
          - name: windows-x64
            os: windows-latest
            artifact: softbodydriver-windows-x64
          - name: macos-universal
            os: macos-latest
            artifact: softbodydriver-macos-universal

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: C ABI test + generate 3D replay HTML
        shell: bash
        run: |
          python3 tools/test_c_api.py build
          BIN=./build/apps/sbsim/sbsim
          if [ -f ./build/apps/sbsim/Release/sbsim.exe ]; then
            BIN=./build/apps/sbsim/Release/sbsim.exe
          fi
          mkdir -p dist/replays dist/include
          cp "$BIN" dist/
          cp core/include/sbcore/c_api.h dist/include/
          for f in build/core/*sbcore*.so build/core/*sbcore*.dylib build/core/*sbcore*.dll build/core/Release/*sbcore*.dll; do
            [ -f "$f" ] && cp "$f" dist/
          done
          cp -r content game dist/
          "$BIN" --scene accel_brake --fps 20 --quiet --record dist/replays/accel_brake.json
          "$BIN" --scene slalom      --fps 20 --quiet --record dist/replays/slalom.json
          "$BIN" --scene curb_impact --fps 20 --quiet --record dist/replays/curb_impact.json
          "$BIN" --scene wall_crash  --duration 1.8 --fps 20 --quiet --record dist/replays/wall_crash.json
          "$BIN" --scene bridge_overload --duration 6.5 --fps 18 --quiet --record dist/replays/bridge_overload.json
          python3 tools/make_viewer.py -o dist/replay_viewer.html \
            dist/replays/accel_brake.json dist/replays/slalom.json \
            dist/replays/curb_impact.json dist/replays/wall_crash.json \
            dist/replays/bridge_overload.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
